# A displace wipe (first, mistakenly, called the warp wipe -- a warp wipe maps the picture onto a 3D object): the outgoing picture bends along a map while the incoming one is revealed through a luma order.
ports: {from: picture, to: picture, progress: curve, map_picture: picture, order_picture: picture}
nodes:
  map:     {op: signal.luma, picture: map_picture}
  bending: {op: curve.map, in: progress, how: scale, factor: 0.6}
  bent:    {op: warp.displace, in: from, map: map, strength: {curve: bending}, edge: mirror}
  order:   {op: signal.luma, picture: order_picture}
  shape:   {op: matte.from_signal, signal: order}
  reveal:  {op: matte.threshold, matte: shape, progress: progress, softness: 0.08}
  out:     {op: merge.over, front: to, back: bent, matte: reveal}
output: out
