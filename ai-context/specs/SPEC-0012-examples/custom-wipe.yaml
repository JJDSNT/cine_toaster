# `matte-wipe` with a moving matte (SPEC-0011): the matte's frames are the shape;
# a ramp over the last tenth makes sure the join ends on the incoming picture.
ports: {from: picture, to: picture, progress: curve, matte_clip: picture}
nodes:
  shape:  {op: matte.from_signal, signal: brightness}
  brightness: {op: signal.luma, picture: matte_clip}
  white:  {op: generate.solid, colour: [1, 1, 1, 1]}
  ending: {op: matte.threshold, matte: white, progress: last_tenth}
  last_tenth: {op: curve.map, in: progress, how: remap, low: 0.9, high: 1.0, out_low: 0, out_high: 1}
  reveal: {op: matte.combine, a: shape, b: ending, how: union}
  out:    {op: merge.over, front: to, back: from, matte: reveal}
output: out
