cena: SC-030
ordem: 30
titulo: Echo Chamber
sequencia: Sequence 02 · The Reply
situacao: A estação repete uma frase que Mara nunca transmitiu.

direcao: |
  Mara fica à direita do quadro e a torre de alto-falantes à esquerda durante
  toda a cena. A sala só é vista do lado do console, então a resposta sempre
  chega de fora de quadro, pela esquerda.

# A planta da cena. Medidas em metros, medidas uma vez.
# `planos` em cada câmera diz quais planos ela cobre — é daí que sai a
# checagem de continuidade.
geografia:
  sala: [6.0, 4.5, 3.2]
  pessoas:
    - nome: Mara Vale
      id: MARA
      x: 4.1
      y: 2.2
      altura_olhos: 1.18
    - nome: Torre de alto-falantes
      id: SPEAKER
      x: 1.2
      y: 2.4
      altura_olhos: 1.55
  eixo: [MARA, SPEAKER]
  cameras:
    - id: CAM-A
      x: 3.4
      y: 0.9
      altura: 1.05
      mira: [4.1, 2.2]
      lente: 50
      planos: "3"
      o: Lado do console, sobre Mara
    - id: CAM-B
      x: 2.2
      y: 1.0
      altura: 1.05
      mira: [1.2, 2.4]
      lente: 35
      planos: "1"
      o: Lado do console, sobre a torre
    - id: CAM-C
      x: 2.9
      y: 0.5
      altura: 1.35
      mira: [2.6, 2.3]
      lente: 28
      planos: "2"
      o: Conjunto

planos:
  - n: 1
    dur: 6
    plano: A torre adormecida acende um canal por vez.
    atuacao: Channels light left to right; the stack reads as machinery waking.

  - n: 2
    dur: 9
    plano: Mara atravessa a sala e para no meio do caminho.
    atuacao: She leaves the console and stops two steps short of the stack.

  - n: 3
    dur: 11
    sujeito: MARA
    olha_para: SPEAKER
    plano: Fixo em Mara enquanto a estação repete as palavras dela.
    atuacao: She does not move. A single blink on the second word, or none at all.

decisoes:
  - pergunta: Quanto da frase é inteligível na primeira escuta?
    proposta: ""
  - pergunta: Manter Mara de perfil durante a resposta?
    proposta: Usar o perfil; não cortar para um close explicativo.
