[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cine-toaster"
version = "0.1.0"
description = "Open, filesystem-first production environment for AI filmmaking"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Cine Toaster contributors" }]
# The scene format is YAML: the production's breakdown is deeply nested and
# carries prose, which TOML punishes. Conventions allow a justified dependency
# rather than contorting an important contract to avoid one.
#
# The screenplay is a core contract too (SPEC-0006). screenplay-tools is small,
# pure Python and MIT; it is pinned because it is early (0.0.x), and only
# `screenplay.py` imports it, so replacing or vendoring it changes one file.
dependencies = ["pyyaml>=6", "screenplay-tools==0.0.10"]

# Frame and clip operations need heavy libraries that are useless to someone who
# only wants to read a production and decide between takes. They stay optional
# and the code says exactly what to install when one is missing.
[project.optional-dependencies]
media = ["numpy>=1.26", "pillow>=10", "opencv-python-headless>=4.10"]
# Narration runs on the machine that is already there: no account, no key,
# nothing sent anywhere. The voice model is downloaded once, into the film.
audio = ["piper-tts>=1.8"]
# Running a transition's own shader instead of an FFmpeg stand-in. Needs a GL
# context, which is why it is not part of the ordinary install.
gpu = ["moderngl>=5.10"]
# The assistant (ADR 0017): a LangGraph agent served over AG-UI. The model is
# reached through an adapter -- by default the Claude Code CLI, with the
# person's own login -- so nothing here needs a key.
agents = ["langgraph>=1.2", "langgraph-checkpoint-sqlite>=3.1", "ag-ui-langgraph>=0.0.45",
          "fastapi>=0.140", "uvicorn>=0.50", "anthropic>=1.0"]
# Claude Code working on a film through Cine Toaster's commands (CT-0045): `toast mcp <project>`.
mcp = ["mcp>=2.2"]
# VFX colour management (CT-0047): OpenColorIO and OpenEXR, both BSD-3.
vfx = ["opencolorio>=2.3", "OpenEXR>=3.2", "numpy>=1.26", "pillow>=10"]
# The plan as an OpenUSD stage (CT-0047): Pixar's USD (modified Apache 2.0).
usd = ["usd-core>=25.5"]

[project.scripts]
toast = "cine_toaster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cine_toaster"]
# The built React app is ignored by git but belongs in the wheel (`make ui` first).
artifacts = ["src/cine_toaster/web_assets/app/**", "src/cine_toaster/web_assets/copilot/**"]

[tool.hatch.build.targets.wheel.force-include]
"examples/demo-project" = "cine_toaster/demo_projects/the-last-signal"
"examples/amiga-demo-reel" = "cine_toaster/demo_projects/amiga-demo-reel"
# The gl-transitions submodule: its shaders and its licence travel together.
"vendor/gl-transitions/transitions" = "cine_toaster/vendor/gl-transitions/transitions"
"vendor/gl-transitions/LICENSE" = "cine_toaster/vendor/gl-transitions/LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
