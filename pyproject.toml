[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cine-toaster"
version = "0.1.0"
description = "Open, filesystem-first production environment for AI filmmaking"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Cine Toaster contributors" }]
dependencies = []

[project.scripts]
toast = "cine_toaster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cine_toaster"]

[tool.hatch.build.targets.wheel.force-include]
"src/cine_toaster/web_assets" = "cine_toaster/web_assets"
"src/cine_toaster/transition_assets" = "cine_toaster/transition_assets"
"examples/demo-project" = "cine_toaster/demo_project"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
