schema_version = 1
id = "chromatic-aberration"
name = "Chromatic aberration"
category = "lens"
says = "Colour fringes at the edges: a cheap or damaged lens, a slight unease."
energy = "low"
use_when = ["A mind not quite right, found footage"]
avoid_when = ["Clean, controlled images"]

[params]
strength = 0.4

[render]
engine = "graph"
effect = "aberration"
# Drawn by the compositing graph (C6, CT-0077), of these primitives:
primitives = ["merge.channels", "signal.channel", "warp.transform"]
