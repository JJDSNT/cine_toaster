schema_version = 1
id = "aces-film-look"
name = "ACES film look"
category = "lens"
says = "The picture seen through ACES 2.0's film response: highlights roll off, contrast settles. An OpenColorIO display view, in the graph."
energy = "low"
use_when = ["Making generated shots share one filmic response", "Taming harsh highlights"]
avoid_when = ["Shots already graded"]

[params]
strength = 1.0
view = "ACES 2.0 - SDR 100 nits (Rec.709)"

[render]
engine = "graph"
effect = "look"
# Drawn by the compositing graph (C6, CT-0077), of these primitives:
primitives = ["colour.lut", "merge.over"]
