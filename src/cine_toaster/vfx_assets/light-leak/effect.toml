schema_version = 1
id = "light-leak"
name = "Light leak"
category = "light"
says = "A warm glow drifts across the frame, as if light had leaked into the camera."
energy = "medium"
use_when = ["Memories, transitions of mood, a dreamlike beat"]
avoid_when = ["Grave or clinical scenes"]

[params]
strength = 0.45
color = "#FF8A3C"

[render]
engine = "graph"
effect = "light-leak"
# Drawn by the compositing graph (C6, CT-0077), of these primitives:
primitives = ["curve.keys", "generate.gradient", "generate.solid", "matte.from_signal", "merge.blend", "merge.over", "signal.luminance", "warp.transform"]
