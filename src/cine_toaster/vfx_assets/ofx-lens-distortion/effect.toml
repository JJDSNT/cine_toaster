schema_version = 1
id = "ofx-lens-distortion"
name = "Lens distortion (OpenFX)"
category = "lens"
says = "The frame bulges like a wide lens: the openfx-misc LensDistortion plugin, run in Natron."
energy = "low"
use_when = ["Matching a wide or fisheye look, a subjective point of view"]
