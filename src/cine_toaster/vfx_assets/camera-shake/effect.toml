schema_version = 1
id = "camera-shake"
name = "Camera shake"
category = "motion"
says = "The frame trembles: an impact, a blast, the ground moving."
energy = "high"
use_when = ["Explosions, impacts, a vehicle"]
avoid_when = ["Calm dialogue"]

[params]
strength = 0.4

[render]
engine = "graph"
effect = "shake"
# Drawn by the compositing graph (C6, CT-0077), of these primitives:
primitives = ["curve.keys", "warp.transform"]
