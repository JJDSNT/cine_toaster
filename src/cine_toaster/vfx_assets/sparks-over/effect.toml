schema_version = 1
id = "sparks-over"
name = "Sparks"
category = "elements"
says = "Sparks showering from a point: a grinder, a short circuit, a hit on metal."
energy = "high"
use_when = ["Damaged machinery, a fight near metal"]
avoid_when = ["When the production has no sparks element: it is refused, not faked"]

# Composites a stock element from the production's library
# (vfx_elements/<id>/element.toml, category = "sparks"). Name it with element: <id>.
[params]
x = 0.5
y = 0.5
scale = 1.0
opacity = 1.0
start = 0.0

[render]
engine = "ffmpeg"
effect = "element"
element_category = "sparks"
