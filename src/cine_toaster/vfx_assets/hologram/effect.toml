schema_version = 1
id = "hologram"
name = "Hologram"
category = "holograms"
says = "The picture becomes a projection: cyan light, scanlines, a colour fringe, an unsteady brightness."
energy = "medium"
use_when = ["A projected figure, a message from far away, a memory replayed by a machine"]
avoid_when = ["Shots that must look real"]

[params]
strength = 0.6

[render]
engine = "graph"
effect = "hologram"
# Drawn by the compositing graph (C6, CT-0077), of these primitives:
primitives = ["colour.grade", "curve.keys", "filter.blur", "generate.gradient", "merge.blend", "merge.channels", "signal.channel", "warp.transform"]
