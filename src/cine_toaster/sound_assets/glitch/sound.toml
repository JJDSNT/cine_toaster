schema_version = 1
id = "glitch"
name = "Glitch"
category = "effect"
says = "Digital noise in stutters: a signal breaking up."
use_when = ["A screen failing, a hologram, a VFX glitch"]

[source]
generate = '''anoisesrc=color=white:a=0.4:d={d}:r=48000,volume='gt(sin(2*PI*13*t)*sin(2*PI*3.7*t),0.2)':eval=frame,highpass=f=400,acrusher=bits=6:samples=8'''

[params]
duration = 0.8
