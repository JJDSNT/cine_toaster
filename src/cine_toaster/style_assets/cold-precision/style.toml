schema_version = 1
id = "cold-precision"
name = "Cold precision (Kubrick-like)"
kind = "manner"
says = "One-point perspective and slow, inexorable movement: control, and dread under it."
# Names people know it by: shown, and accepted by `style:`.
aka = ["Kubrick", "Kubrick-like"]
# For people reading the entry; never sent to a model, never a claim of endorsement.
inspired_by = ["Stanley Kubrick"]
framing = ["one-point perspective down corridors", "the subject at the vanishing point", "wide lenses that make rooms vast"]
colour = "clinical, cold or saturated single colours, practical light in frame"
sound = "silence, then classical music"
titles = ["card"]
# What a video model is told about the image, in words of craft.
prompt = "one-point perspective symmetrical composition, wide-angle lens, slow steady camera movement, cold clinical lighting"
use_when = ["Institutions, machines, a mind coming apart"]
avoid_when = ["Warm intimacy"]

[camera]
lens = "wide"
prefer = ["push-in", "pull-out", "follow", "locked-off"]
avoid = ["handheld", "whip-pan-left", "whip-pan-right", "crash-zoom-in"]

[editing]
shot_seconds = [4, 30]
prefer_cuts = ["hard"]
avoid_cuts = ["jump"]
prefer_transitions = ["dip-to-black"]
avoid_transitions = ["pixelate", "switcher-flip", "diamond-wipe", "clock-wipe", "iris-open"]

[performance]
intensity = "subtle"
max = "overwhelming"
notes = "controlled, then breaking all at once"
