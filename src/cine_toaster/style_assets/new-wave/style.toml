schema_version = 1
id = "new-wave"
name = "New wave (Nouvelle Vague)"
kind = "movement"
says = "Cinema that shows it is cinema: jump cuts, a light camera in the street, direct address."
# Names people know it by: shown, and accepted by `style:`.
aka = ["Nouvelle Vague", "Godard-like"]
# For people reading the entry; never sent to a model, never a claim of endorsement.
inspired_by = ["the French New Wave, 1958-1968"]
framing = ["handheld in real places", "characters break the frame or look at the lens", "playful, loose composition"]
colour = "natural light, high-contrast black and white or bold primaries"
sound = "direct sound, music cut abruptly"
titles = ["card", "typewriter"]
# What a video model is told about the image, in words of craft.
prompt = "handheld camera on a real street, natural light, spontaneous loose framing, grainy film stock"
use_when = ["Youth, freedom, a story that plays with its own telling"]
avoid_when = ["Invisible storytelling"]

[camera]
lens = "normal"
prefer = ["handheld", "follow", "walk-and-talk", "pan-left", "pan-right"]
avoid = ["crane-up", "crane-down", "aerial-orbit"]

[editing]
shot_seconds = [1, 20]
prefer_cuts = ["jump", "hard"]
avoid_cuts = []
prefer_transitions = []
avoid_transitions = ["cross-dissolve", "blur-dissolve"]

[performance]
intensity = "clear"
max = "overwhelming"
notes = "spontaneous, improvised, sometimes to the camera"
