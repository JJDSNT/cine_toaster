schema_version = 1
id = "romantic-melancholy"
name = "Romantic melancholy (Wong Kar-wai-like)"
kind = "manner"
says = "Longing in saturated colour: smeared motion, close faces, time slipping."
# Names people know it by: shown, and accepted by `style:`.
aka = ["Wong Kar-wai", "Wong Kar-wai-like"]
# For people reading the entry; never sent to a model, never a claim of endorsement.
inspired_by = ["Wong Kar-wai"]
framing = ["faces close, through glass, doorways and reflections", "the subject off-centre with empty space beside them"]
colour = "saturated reds and greens, neon and tungsten, smeared step-printed motion"
sound = "a repeated song, voice-over"
titles = ["caption", "card"]
# What a video model is told about the image, in words of craft.
prompt = "saturated neon and tungsten colours, shallow focus through glass and reflections, smeared slow shutter motion, intimate close framing"
use_when = ["Unrequited love, memory, the city at night"]
avoid_when = ["Clarity of action"]

[camera]
lens = "long"
prefer = ["handheld", "locked-off", "side-tracking", "push-past"]
avoid = ["top-shot", "aerial-orbit"]

[editing]
shot_seconds = [2, 12]
prefer_cuts = ["hard", "jump"]
avoid_cuts = []
prefer_transitions = ["cross-dissolve"]
avoid_transitions = ["pixelate", "switcher-flip", "diamond-wipe", "clock-wipe"]

[performance]
intensity = "subtle"
max = "clear"
notes = "glances held too long, things not said"
