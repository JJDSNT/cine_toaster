schema_version = 1
id = "colour-font"
name = "Colour font"
category = "texture"
says = "Rainbow letters whose colours cycle, with a white rim and a drop shadow: the Amiga's ColorFonts, cycling as they did."
energy = "high"
use_when = ["A playful title, a retro reel, a homage to the Toaster's era."]
avoid_when = ["A quiet film whose titles should not be noticed"]

# A style (C6b, CT-0078): recipes of the primitives -- the letters as a matte over a gradient, an outline, a
# bevel, a shadow. Any title takes a `style`; this item is one dressed for you. Lengths in pixels at 720 lines.
[params]
size = 96
fade_in = 0.6
fade_out = 0.8

[params.style]
fill = {gradient = {colours = ["#FF2A2A", "#FFB52A", "#F6FF2A", "#2AFF6B", "#2AB8FF", "#7A2AFF"], angle = 0.0}}
cycle = {speed = 120.0}
outline = {width = 4.0, colour = "#FFFFFF"}
bevel = {radius = 5.0}
shadow = {offset = [6.0, 8.0], blur = 6.0, opacity = 0.8}

[render]
engine = "graph"
effect = "fade"
# Drawn by the compositing graph (C6b, CT-0078), of these primitives:
primitives = ["colour.cycle", "curve.keys", "filter.bevel", "filter.blur", "generate.gradient", "generate.solid", "generate.text", "matte.from_signal", "merge.over", "signal.channel", "warp.transform"]
