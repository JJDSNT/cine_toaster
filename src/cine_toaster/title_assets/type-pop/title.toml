schema_version = 1
id = "type-pop"
name = "Type: pop"
category = "motion"
says = "Letters pop up from nothing, from the middle of the word outwards, overshooting and settling."
energy = "medium"
use_when = ["Energy, a reveal with a beat; demo reels, shows, products."]
avoid_when = ["Drama that should not notice its titles"]

# Per-letter animation (C6b, CT-0078): each letter plays the keys from its own start, `stagger` seconds after the
# one before it. Offsets are pixels at 720 lines, turns degrees, times seconds from the letter's start.
[params]
size = 64
spaced = false
enter_at = 0.2
fade_out = 0.6

[params.letters]
keys = [{t = 0.0, scale = 0.0, opacity = 0.0, ease = [0.34, 1.56, 0.64, 1.0]}, {t = 0.35, scale = 1.0, opacity = 1.0}]
stagger = 0.05
order = "centre"

[render]
engine = "graph"
effect = "letters"
# Drawn by the compositing graph (C6b, CT-0078), of these primitives:
primitives = ["curve.keys", "generate.text", "merge.over"]
