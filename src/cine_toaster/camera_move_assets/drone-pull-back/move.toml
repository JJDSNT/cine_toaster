schema_version = 1
id = "drone-pull-back"
name = "Drone pull back"
category = "drone/crane"
says = "A rise away from the place: leaving, the world going on without us."
energy = "medium"
use_when = [
  "Endings, departures",
]
avoid_when = [
  "When the audience still needs to be close",
]

# What the move implies in the scene's plan (SPEC-0005); empty `kind` means the
# plan cannot see it (a rig, a lens effect), so nothing is checked.
[implies]
kind = "dolly"
direction = "out"
rig = "drone"

# The words a video model is given for this move.
[prompt]
text = "an aerial shot flying slowly back and up, away from the subject"
