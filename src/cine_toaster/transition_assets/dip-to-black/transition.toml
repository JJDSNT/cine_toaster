schema_version = 1
id = "dip-to-black"
name = "Dip to Black"
kind = "graph"
# Replaces gl-transitions' shader of this name; the recipe below is Cine Toaster's own (CT-0076).
upstream = "gl-transitions:fadecolor"
category = "dissolve"
description = "The outgoing shot fades to black, holds, and the incoming shot fades up."
guidance = "A full stop. Use it where the story rests: the end of a sequence, a real passage of time, a death. Overused, it turns every scene into an ending."
energy = "low"
motion = "neutral"
duration_ms = 1400
preview = "preview.webm"  # drawn from the graph by transitions.render_preview
tags = ["classic", "temporal", "pause", "ending"]
use_when = [
  "A sequence or an act ends",
  "Time passes that the audience should feel",
  "The next scene must start clean",
]
avoid_when = [
  "Inside a scene: it breaks continuous time",
  "Several in a row: each one weakens the last",
]

license = "CC0-1.0"
author = "Cine Toaster contributors"

# How this item renders on each engine that can execute it. Declared by whoever
# wrote the item, never inferred by the renderer: a substitution nobody chose
# is a substitution nobody can argue with.
[render]
ffmpeg = "graph"
ffmpeg_note = "Drawn from its graph by GL, or by the reference where GL cannot run: no stand-in is needed (CT-0076)."

[graph]
ports = {from = "picture", to = "picture", progress = "curve"}
output = "out"

[graph.nodes]
black = {op = "generate.solid", colour = [0.0, 0.0, 0.0, 1.0]}
down = {op = "curve.map", in = "progress", how = "remap", low = 0.0, high = 0.45, out_low = 0.0, out_high = 1.0}
up = {op = "curve.map", in = "progress", how = "remap", low = 0.55, high = 1.0, out_low = 0.0, out_high = 1.0}
dark = {op = "merge.mix", a = "from", b = "black", by = "down"}
out = {op = "merge.mix", a = "dark", b = "to", by = "up"}
