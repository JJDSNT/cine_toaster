schema_version = 1
id = "cross-dissolve"
name = "Cross Dissolve"
kind = "graph"
category = "dissolve"
description = "A neutral opacity blend from the outgoing shot into the incoming shot."
guidance = "Use as invisible punctuation when time, place, or emotional emphasis shifts without calling attention to the edit."
energy = "low"
motion = "neutral"
duration_ms = 1200
preview = "preview.webm"  # drawn from the graph by transitions.render_preview
tags = ["classic", "subtle", "temporal", "soft"]
use_when = [
  "The edit should feel continuous and calm",
  "A passage of time needs gentle emphasis",
  "Two compositions have compatible visual weight",
]
avoid_when = [
  "The cut must feel abrupt or alarming",
  "Overlapping high-contrast subjects create visual mud",
]
license = "CC0-1.0"
author = "Cine Toaster contributors"

# How this item renders on each engine that can execute it. Declared by whoever
# wrote the item, never inferred by the renderer: a substitution nobody chose
# is a substitution nobody can argue with.
[render]
ffmpeg = "graph"
ffmpeg_note = "Drawn from its graph by GL, or by the reference where GL cannot run: no stand-in is needed (CT-0076)."

[graph]
ports = {from = "picture", to = "picture", progress = "curve"}
output = "out"

[graph.nodes]
out = {op = "merge.mix", a = "from", b = "to", by = "progress"}
