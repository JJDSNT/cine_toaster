schema_version = 1
id = "diamond-wipe"
name = "Diamond Wipe"
kind = "graph"
category = "wipe/geometric"
description = "The incoming shot expands from the center as a softened diamond."
guidance = "A conspicuous graphic transition with period-TV character. Treat it as a deliberate voice, not connective tissue."
energy = "high"
motion = "outward"
duration_ms = 900
preview = "preview.webm"  # drawn from the graph by transitions.render_preview
tags = ["geometric", "retro", "centered", "playful", "toaster-like"]
use_when = [
  "The film intentionally invokes broadcast or retro-video language",
  "The center of the incoming image contains the visual destination",
  "A chapter change should be overt and playful",
]
avoid_when = [
  "A dramatic performance should remain emotionally invisible",
  "Important subjects sit near the incoming frame edges",
]
license = "CC0-1.0"
author = "Cine Toaster contributors"

# How this item renders on each engine that can execute it. Declared by whoever
# wrote the item, never inferred by the renderer: a substitution nobody chose
# is a substitution nobody can argue with.
[render]
ffmpeg = "graph"
ffmpeg_note = "Drawn from its graph by GL, or by the reference where GL cannot run: no stand-in is needed (CT-0076)."

[graph]
ports = {from = "picture", to = "picture", progress = "curve"}
output = "out"

[graph.nodes]
field = {op = "generate.gradient", kind = "diamond"}
order = {op = "signal.luminance", picture = "field"}
shape = {op = "matte.from_signal", signal = "order"}
reveal = {op = "matte.threshold", matte = "shape", progress = "progress", softness = 0.035}
out = {op = "merge.over", front = "to", back = "from", matte = "reveal"}
