schema_version = 1
id = "iris-open"
name = "Iris Open"
kind = "graph"
# Replaces gl-transitions' shader of this name; the recipe below is Cine Toaster's own (CT-0076).
upstream = "gl-transitions:circleopen"
category = "wipe/geometric"
description = "The incoming shot opens as a circle from the centre of frame."
guidance = "A period device and a pointer: it draws the eye to the centre. Use it knowingly, as homage or storybook framing, with the subject centred in the incoming shot."
energy = "medium"
motion = "radial"
duration_ms = 1000
preview = "preview.webm"  # drawn from the graph by transitions.render_preview
tags = ["iris", "vintage", "radial", "graphic"]
use_when = [
  "Silent-film or storybook tone",
  "The incoming subject is centred",
]
avoid_when = [
  "Naturalistic drama",
  "The incoming subject sits at the edge of frame",
]

license = "CC0-1.0"
author = "Cine Toaster contributors"

# How this item renders on each engine that can execute it. Declared by whoever
# wrote the item, never inferred by the renderer: a substitution nobody chose
# is a substitution nobody can argue with.
[render]
ffmpeg = "graph"
ffmpeg_note = "Drawn from its graph by GL, or by the reference where GL cannot run: no stand-in is needed (CT-0076)."

[graph]
ports = {from = "picture", to = "picture", progress = "curve"}
output = "out"

[graph.nodes]
field = {op = "generate.gradient", kind = "circle"}
order = {op = "signal.luminance", picture = "field"}
shape = {op = "matte.from_signal", signal = "order"}
reveal = {op = "matte.threshold", matte = "shape", progress = "progress", softness = 0.02}
out = {op = "merge.over", front = "to", back = "from", matte = "reveal"}
