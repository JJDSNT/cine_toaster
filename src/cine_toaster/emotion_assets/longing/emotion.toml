schema_version = 1
id = "longing"
name = "Longing"
family = "sadness"
says = "Wanting what is out of reach, or gone."
near = ["sadness", "hope", "nostalgia"]

[signals]
face = ["a soft, distant gaze", "inner brows slightly raised", "lips slightly parted"]
body = ["stillness", "leaning toward a window, a door, an object", "a hand reaching and stopping"]
voice = ["soft, trailing"]

# How a video model is asked to act it: what can be seen, not a label.
[ask]
subtle = "the gaze drifts to something far away and stays there"
clear = "a distant look, inner brows faintly raised, lips parted as if about to speak"
overwhelming = "eyes fixed on what cannot be had, a hand half raised toward it, the breath held"

# The delivery of a line spoken in it, when the line has none of its own.
[voice]
subtle = "soft and trailing"
clear = "hushed, words left unfinished"
overwhelming = "barely spoken, as if to someone not there"

# FACS action units (the public coding system) and their weight at full intensity.
[facs]
1 = 0.5
25 = 0.3
64 = 0.2
