schema_version = 1
id = "compassion"
name = "Compassion"
family = "connection"
says = "Feeling another's pain and wanting to ease it."
near = ["tenderness", "sadness"]

[signals]
face = ["inner brows raised", "a softened mouth", "steady, kind eyes"]
body = ["moving closer", "an open hand", "kneeling to their level"]
voice = ["calm, slow, warm"]

# How a video model is asked to act it: what can be seen, not a label.
[ask]
subtle = "the brows soften and the eyes stay with them"
clear = "inner brows raised, a gentle look, a hand reaching to them"
overwhelming = "eyes full, holding them as they break, rocking them gently"

# The delivery of a line spoken in it, when the line has none of its own.
[voice]
subtle = "calm and warm"
clear = "slow and kind"
overwhelming = "a hush, soothing"

# FACS action units (the public coding system) and their weight at full intensity.
[facs]
1 = 0.6
4 = 0.2
12 = 0.2
