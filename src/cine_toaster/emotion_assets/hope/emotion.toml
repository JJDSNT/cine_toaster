schema_version = 1
id = "hope"
name = "Hope"
family = "thought"
says = "A chance it might be all right."
near = ["longing", "relief", "determination"]

[signals]
face = ["brows lifting slightly", "a careful beginning of a smile", "eyes brightening"]
body = ["leaning forward", "a breath drawn in", "stillness, waiting"]
voice = ["lifting at the end"]

# How a video model is asked to act it: what can be seen, not a label.
[ask]
subtle = "the eyes brighten and the breath catches"
clear = "the brows lift, a careful smile begins, leaning toward what is coming"
overwhelming = "eyes shining, holding the breath, the smile breaking through"

# The delivery of a line spoken in it, when the line has none of its own.
[voice]
subtle = "lifting"
clear = "bright, careful"
overwhelming = "trembling with it"

# FACS action units (the public coding system) and their weight at full intensity.
[facs]
1 = 0.5
2 = 0.3
12 = 0.4
5 = 0.2
