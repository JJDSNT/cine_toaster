<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cine Toaster</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">CT</span>
        <div>
          <strong>Cine Toaster</strong>
          <span id="project-name">Opening production…</span>
        </div>
      </div>
      <div class="production-position">
        <span id="project-format">PRODUCTION</span>
        <strong id="project-phase">Loading</strong>
      </div>
      <button id="quick-find" class="quiet-button" type="button">Find anything <kbd>/</kbd></button>
    </header>

    <div class="app-shell">
      <aside class="sidebar">
        <button type="button" data-view="overview" class="workspace-home active">
          <span>OV</span><strong>Overview</strong>
        </button>

        <!-- Two halves of the same production. One asks "what is this scene?",
             the other "is this shot good?". Separate rooms because attention is
             what they divide, not data. -->
        <div class="sidebar-title">Writing</div>
        <nav class="module-navigation" aria-label="Writing rooms">
          <button type="button" data-view="script"><span>SR</span><strong>Script</strong></button>
          <button type="button" data-view="storyboard"><span>SB</span><strong>Storyboard</strong><em id="storyboard-nav-count">0</em></button>
          <button type="button" data-view="dialogue"><span>DL</span><strong>Dialogue</strong><em id="dialogue-nav-count">0</em></button>
        </nav>

        <div class="sidebar-title">Production</div>
        <nav class="module-navigation" aria-label="Production rooms">
          <button type="button" data-view="sequences"><span>SQ</span><strong>Sequences</strong><em id="sequence-nav-count">0</em></button>
          <button type="button" data-view="scenes"><span>SC</span><strong>Scenes</strong><em id="scene-nav-count">0</em></button>
          <button type="button" data-view="review"><span>RV</span><strong>Review</strong><em id="review-nav-count">0</em></button>
          <button type="button" data-view="cut"><span>CT</span><strong>Cut</strong><em id="cut-nav-count">0</em></button>
          <button type="button" data-view="cast"><span>CS</span><strong>Cast</strong><em id="cast-nav-count">0</em></button>
          <button type="button" data-view="locations"><span>LO</span><strong>Locations</strong><em id="locations-nav-count">0</em></button>
          <a class="nav-link" href="/app/"><span>CV</span><strong>Canvas</strong></a>
        </nav>

        <div class="sidebar-title secondary">Reference</div>
        <nav class="module-navigation" aria-label="Reference rooms">
          <button type="button" data-view="transitions"><span>TR</span><strong>Transitions</strong><em id="transition-nav-count">0</em></button>
          <button type="button" data-view="moves"><span>CM</span><strong>Camera moves</strong><em id="moves-nav-count">0</em></button>
          <button type="button" data-view="titles"><span>TI</span><strong>Titles</strong><em id="titles-nav-count">0</em></button>
          <button type="button" data-view="vfx"><span>FX</span><strong>VFX</strong><em id="vfx-nav-count">0</em></button>
          <button type="button" data-view="emotions"><span>EM</span><strong>Emotions</strong><em id="emotions-nav-count">0</em></button>
          <button type="button" data-view="sounds"><span>SD</span><strong>Sound</strong><em id="sounds-nav-count">0</em></button>
          <button type="button" data-view="library"><span>LB</span><strong>Library</strong></button>
          <button type="button" data-view="knowledge"><span>KN</span><strong>Knowledge</strong><em id="knowledge-nav-count">0</em></button>
        </nav>

        <div class="sidebar-foot">
          <span class="live-dot"></span>
          <div><strong>Filesystem project</strong><small id="project-root">Read-only workspace</small></div>
        </div>
      </aside>

      <main id="workspace" class="workspace" tabindex="-1"></main>
    </div>

    <dialog id="find-dialog" class="find-dialog">
      <form id="search-form" class="search-form">
        <input id="search-input" type="search" placeholder="Search production files and text…" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <div id="search-results" class="search-results"></div>
      <button id="find-close" class="dialog-close" type="button" aria-label="Close">×</button>
    </dialog>

    <dialog id="preview-dialog" class="preview-dialog">
      <div class="dialog-heading">
        <div><span id="preview-kind" class="eyebrow"></span><h2 id="preview-name"></h2></div>
        <button id="preview-close" class="quiet-button" type="button">Close</button>
      </div>
      <div id="preview-content" class="preview-content"></div>
      <p id="preview-path" class="preview-path"></p>
    </dialog>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
