<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cine Toaster</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">CT</span>
        <div>
          <strong>Cine Toaster</strong>
          <span id="project-name">Opening production…</span>
        </div>
      </div>
      <div class="production-position">
        <span id="project-format">PRODUCTION</span>
        <strong id="project-phase">Loading</strong>
      </div>
      <button id="quick-find" class="quiet-button" type="button">Find anything <kbd>/</kbd></button>
    </header>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-title">Control room</div>
        <nav class="module-navigation" aria-label="Production workspaces">
          <button type="button" data-view="overview" class="active"><span>OV</span><strong>Overview</strong></button>
          <button type="button" data-view="sequences"><span>SQ</span><strong>Sequences</strong><em id="sequence-nav-count">0</em></button>
          <button type="button" data-view="scenes"><span>SC</span><strong>Scenes</strong><em id="scene-nav-count">0</em></button>
          <button type="button" data-view="review"><span>RV</span><strong>Review</strong><em id="review-nav-count">0</em></button>
          <button type="button" data-view="transitions"><span>TR</span><strong>Transitions</strong><em id="transition-nav-count">0</em></button>
          <button type="button" data-view="library"><span>LB</span><strong>Library</strong></button>
          <button type="button" data-view="knowledge"><span>KN</span><strong>Knowledge</strong><em id="knowledge-nav-count">0</em></button>
        </nav>

        <div class="sidebar-title secondary">Production rooms</div>
        <div class="future-navigation">
          <span><b>ST</b> Story <small>planned</small></span>
          <span><b>WD</b> World <small>planned</small></span>
          <span><b>ED</b> Edit <small>planned</small></span>
          <span><b>JB</b> Jobs <small>planned</small></span>
        </div>

        <div class="sidebar-foot">
          <span class="live-dot"></span>
          <div><strong>Filesystem project</strong><small id="project-root">Read-only workspace</small></div>
        </div>
      </aside>

      <main id="workspace" class="workspace" tabindex="-1"></main>
    </div>

    <dialog id="find-dialog" class="find-dialog">
      <form id="search-form" class="search-form">
        <input id="search-input" type="search" placeholder="Search production files and text…" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <div id="search-results" class="search-results"></div>
      <button id="find-close" class="dialog-close" type="button" aria-label="Close">×</button>
    </dialog>

    <dialog id="preview-dialog" class="preview-dialog">
      <div class="dialog-heading">
        <div><span id="preview-kind" class="eyebrow"></span><h2 id="preview-name"></h2></div>
        <button id="preview-close" class="quiet-button" type="button">Close</button>
      </div>
      <div id="preview-content" class="preview-content"></div>
      <p id="preview-path" class="preview-path"></p>
    </dialog>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
